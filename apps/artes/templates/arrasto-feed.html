<div class="arte" style="width: 1080px; height: 1350px; padding: 72px; display: flex; flex-direction: column;">
<img class="simbolo" src="assets/simbolo-branco.png" alt="" style="right: -220px; top: 480px; width: 720px;">
<div class="topo">
  <img class="logo" src="assets/logo-branco.png" alt="UniCesumar">
  <div class="selo">ATENÇÃO, ALUNO</div>
</div>
<div class="miolo" style="gap: 40px;">
  <div style="display: flex; align-items: center; gap: 60px; padding-left: 30px;">
    <div class="medalhao" style="width: 250px; height: 250px;">{{{icone_svg}}}</div>
    <div style="display: flex; flex-direction: column; max-width: 560px;">
      <div style="font-size: 72px; font-weight: 800; line-height: 1.02;">{{titulo}}</div>
      <div style="font-size: 46px; font-weight: 500; line-height: 1.1; color: #00D0FF; margin-top: 12px; {{{subtitulo_oculto}}}">{{subtitulo}}</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div style="font-size: 44px; font-weight: 500; {{{rotulo_data_oculto}}}">{{rotulo_data}}</div>
    <div style="font-size: 190px; font-weight: 800; line-height: 1;">{{limite}}</div>
    <div style="font-size: 40px; font-weight: 700; color: #FFC800; text-align: center; margin-top: 8px; {{{alerta_oculto}}}">{{alerta}}</div>
  </div>
  <div class="cartao-azul" style="display: flex; align-items: center; gap: 40px; padding: 28px 32px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 38px; font-weight: 700; line-height: 1.2;">{{contato_titulo}}</div>
      <div style="font-size: 30px; font-weight: 300; line-height: 1.4;">{{{contato_texto_html}}}</div>
    </div>
    <div style="flex: none; width: 200px; height: 200px; border: 4px solid #00D0FF; border-radius: 16px; background: #FFFFFF; padding: 12px;"><img src="{{{qr_url}}}" alt="" style="width: 100%; height: 100%; display: block;"></div>
  </div>
</div>
<div class="rodape"><div class="polo">Polo {{polo}}</div><div class="zap">WhatsApp {{whatsapp}}</div></div>
</div>
