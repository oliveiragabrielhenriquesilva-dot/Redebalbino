<style>
.arte div { text-wrap: balance; }
.preco-de { font-size: 34px; font-weight: 300; color: rgba(255,255,255,0.75); text-decoration: line-through; text-decoration-thickness: 2px; }
</style>
<div class="arte" style="width: 1080px; height: 1920px; padding: 230px 80px 240px; display: flex; flex-direction: column;">
<img class="simbolo" src="assets/simbolo-branco.png" alt="" style="right: -260px; top: 160px; width: 860px;">
<div class="topo">
  <img class="logo" src="assets/logo-branco.png" alt="UniCesumar">
  <div class="selo" style="{{{selo_oculto}}}">{{selo}}</div>
</div>
<div class="miolo" style="justify-content: space-evenly; align-items: center; text-align: center; gap: 26px; padding: 10px 0 20px;">
  <div class="medalhao" style="width: 190px; height: 190px;">{{{icone_svg}}}</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div style="font-size: 46px; font-weight: 500; line-height: 1.1;"><span style="{{{linha1_oculto}}}">{{linha1}}</span> <span style="color: #00D0FF; {{{linha2_oculto}}}">{{linha2}}</span></div>
    <div style="font-size: {{{curso_tamanho_story}}}px; font-weight: 800; line-height: 1.02; max-width: 920px;">{{curso}}</div>
  </div>
  <div class="cartao-azul" style="align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 36px;">
    <div style="font-size: 38px; font-weight: 500;">{{primeira_rotulo}}</div>
    <div style="font-size: 150px; font-weight: 800; line-height: 1; white-space: nowrap;">{{primeira}}</div>
    <div style="display: flex; align-items: baseline; gap: 16px; margin-top: 10px; {{{desconto_oculto}}}">
      <div style="font-size: 76px; font-weight: 800; color: #FFC800; line-height: 1; white-space: nowrap;">{{desconto}}</div>
      <div style="font-size: 32px; font-weight: 500; text-align: left; max-width: 300px;">{{desconto_rotulo}}</div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; {{{mensalidade_oculto}}}">
    <div style="font-size: 36px; font-weight: 500;">{{mensalidade_rotulo}}</div>
    <div style="display: flex; align-items: baseline; gap: 18px;"><div class="preco-de" style="{{{preco_cheio_oculto}}}">{{preco_cheio}}</div><div style="font-size: 64px; font-weight: 800; color: #00D0FF;">{{mensalidade}}</div></div>
  </div>
  <div style="font-size: 24px; font-weight: 300; color: rgba(255,255,255,0.75); line-height: 1.35; max-width: 880px; {{{observacao_oculto}}}">{{observacao}}</div>
  <div class="cartao-azul" style="align-self: stretch; display: flex; align-items: center; gap: 36px; padding: 24px 32px; text-align: left;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 44px; font-weight: 800; line-height: 1.15;">Matricule-se</div>
      <div style="font-size: 30px; font-weight: 300; line-height: 1.4;">Aponte a câmera e fale com o polo pelo WhatsApp.</div>
    </div>
    <div style="flex: none; width: 190px; height: 190px; border: 4px solid #00D0FF; border-radius: 18px; background: #FFFFFF; padding: 12px;"><img src="{{{qr_url}}}" alt="" style="width: 100%; height: 100%; display: block;"></div>
  </div>
</div>
<div class="rodape"><div class="polo" style="font-size: 34px;">Polo {{polo}}</div><div class="zap" style="font-size: 30px;">WhatsApp {{whatsapp}}</div></div>
</div>
