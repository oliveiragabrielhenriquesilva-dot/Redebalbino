<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="{{{base}}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;500;700;800&display=swap">
<style>
html, body { margin: 0; padding: 0; background: #03132D; }
* { box-sizing: border-box; }
.arte { position: relative; overflow: hidden; background: linear-gradient(170deg, #03132D 0%, #03132D 55%, #172C58 100%); font-family: 'Onest', 'Segoe UI', Arial, sans-serif; color: #FFFFFF; }
.dest { font-weight: 700; color: #00D0FF; }
.simbolo { position: absolute; height: auto; opacity: 0.07; pointer-events: none; }
.logo { width: 320px; height: auto; display: block; }
.selo { background: #00D0FF; color: #03132D; border-radius: 999px; padding: 14px 32px; font-size: 30px; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
.topo { position: relative; display: flex; justify-content: space-between; align-items: center; }
.miolo { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }

/* Medalhão do ícone (substitui a foto) */
.medalhao { position: relative; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 38%, rgba(0,208,255,0.24) 0%, rgba(23,44,88,0.95) 72%);
  border: 3px solid rgba(0,208,255,0.65);
  box-shadow: 0 0 0 26px rgba(0,208,255,0.07), 0 0 0 54px rgba(0,208,255,0.035); }
.medalhao svg { width: 52%; height: 52%; display: block; }

/* Cartões de período (rótulo ciano à esquerda, datas à direita) */
.periodo { display: flex; align-items: stretch; border: 3px solid #00D0FF; border-radius: 20px; overflow: hidden; }
.periodo .cab { background: #00D0FF; color: #03132D; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; letter-spacing: 1px; }
.periodo .val { flex: 1; font-weight: 800; line-height: 1; display: flex; align-items: center; justify-content: center; white-space: nowrap; }

.cartao-azul { position: relative; background: rgba(23,44,88,0.85); border: 2px solid rgba(0,208,255,0.4); border-radius: 20px; }
.passo { display: flex; gap: 28px; align-items: center; padding: 26px 32px; }
.passo .num { flex: none; width: 72px; height: 72px; border-radius: 50%; background: #00D0FF; color: #03132D; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; }

.rodape { position: relative; border-top: 2px solid rgba(0,208,255,0.5); padding-top: 24px; display: flex; justify-content: space-between; align-items: center; }
.rodape .polo { font-size: 32px; font-weight: 700; }
.rodape .zap { font-size: 28px; font-weight: 500; color: #00D0FF; }
</style>
</head>
<body>
{{{conteudo}}}
</body>
</html>
