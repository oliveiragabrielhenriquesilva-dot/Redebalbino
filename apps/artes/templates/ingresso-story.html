<style>
.arte div { text-wrap: balance; }
</style>
<div class="arte" style="width: 1080px; height: 1920px; padding: 230px 80px 240px; display: flex; flex-direction: column;">
<img class="simbolo" src="assets/simbolo-branco.png" alt="" style="left: -260px; top: 820px; width: 820px;">
<div class="topo">
  <img class="logo" src="assets/logo-branco.png" alt="UniCesumar">
  <div class="selo" style="{{{selo_oculto}}}">{{selo}}</div>
</div>
<div class="miolo" style="align-items: center; justify-content: space-evenly; text-align: center; padding: 24px 0;">
  <div class="medalhao" style="width: 240px; height: 240px;">{{{icone_svg}}}</div>
  <div style="font-size: 92px; font-weight: 800; line-height: 1.04; max-width: 900px;">{{{titulo_html}}}</div>
  <div style="align-self: stretch; display: flex; flex-direction: column; gap: 22px; text-align: left;">
    <div class="cartao-azul passo" style="{{{opcao1_titulo_oculto}}}"><div class="num">1</div><div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 42px; font-weight: 700;">{{opcao1_titulo}}</div><div style="font-size: 32px; font-weight: 300; {{{opcao1_texto_oculto}}}">{{{opcao1_texto_html}}}</div></div></div>
    <div class="cartao-azul passo" style="{{{opcao2_titulo_oculto}}}"><div class="num">2</div><div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 42px; font-weight: 700;">{{opcao2_titulo}}</div><div style="font-size: 32px; font-weight: 300; {{{opcao2_texto_oculto}}}">{{{opcao2_texto_html}}}</div></div></div>
    <div class="cartao-azul passo" style="{{{opcao3_titulo_oculto}}}"><div class="num">3</div><div style="display: flex; flex-direction: column; gap: 6px;"><div style="font-size: 42px; font-weight: 700;">{{opcao3_titulo}}</div><div style="font-size: 32px; font-weight: 300; {{{opcao3_texto_oculto}}}">{{{opcao3_texto_html}}}</div></div></div>
  </div>
  <div class="cartao-azul" style="align-self: stretch; display: flex; align-items: center; gap: 36px; padding: 28px 36px; text-align: left;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 42px; font-weight: 700; line-height: 1.2; {{{cta_oculto}}}">{{cta}}</div>
      <div style="font-size: 30px; font-weight: 300;">Aponte a câmera e chame no WhatsApp.</div>
    </div>
    <div style="flex: none; width: 210px; height: 210px; border: 4px solid #00D0FF; border-radius: 18px; background: #FFFFFF; padding: 12px;"><img src="{{{qr_url}}}" alt="" style="width: 100%; height: 100%; display: block;"></div>
  </div>
</div>
<div class="rodape"><div class="polo" style="font-size: 34px;">Polo {{polo}}</div><div class="zap" style="font-size: 30px;">WhatsApp {{whatsapp}}</div></div>
</div>
