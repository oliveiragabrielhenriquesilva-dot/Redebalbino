<div class="arte" style="width: 1080px; height: 1920px; padding: 230px 80px 240px; display: flex; flex-direction: column;">
<img class="simbolo" src="assets/simbolo-branco.png" alt="" style="left: -260px; top: 820px; width: 820px;">
<div class="topo">
  <img class="logo" src="assets/logo-branco.png" alt="UniCesumar">
  <div class="selo">ATENÇÃO, ALUNO</div>
</div>
<div class="miolo" style="align-items: center; justify-content: space-evenly; text-align: center; padding: 24px 0;">
  <div class="medalhao" style="width: 260px; height: 260px;">{{{icone_svg}}}</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
    <div style="font-size: 88px; font-weight: 800; line-height: 1.04; max-width: 900px;">{{titulo}}</div>
    <div style="font-size: 50px; font-weight: 500; line-height: 1.2; color: #00D0FF; max-width: 860px; {{{subtitulo_oculto}}}">{{subtitulo}}</div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="font-size: 46px; font-weight: 500; {{{rotulo_data_oculto}}}">{{rotulo_data}}</div>
    <div style="font-size: 230px; font-weight: 800; line-height: 0.95;">{{limite}}</div>
    <div style="font-size: 42px; font-weight: 700; color: #FFC800; margin-top: 14px; max-width: 860px; {{{alerta_oculto}}}">{{alerta}}</div>
  </div>
  <div class="cartao-azul" style="align-self: stretch; display: flex; align-items: center; gap: 40px; padding: 30px 36px; text-align: left; {{{contato_titulo_oculto}}}">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 40px; font-weight: 700; line-height: 1.2;">{{contato_titulo}}</div>
      <div style="font-size: 32px; font-weight: 300; line-height: 1.4;">{{{contato_texto_html}}}</div>
    </div>
    <div style="flex: none; width: 230px; height: 230px; border: 4px solid #00D0FF; border-radius: 18px; background: #FFFFFF; padding: 14px;"><img src="{{{qr_url}}}" alt="" style="width: 100%; height: 100%; display: block;"></div>
  </div>
</div>
<div class="rodape"><div class="polo" style="font-size: 34px;">Polo {{polo}}</div><div class="zap" style="font-size: 30px;">WhatsApp {{whatsapp}}</div></div>
</div>
