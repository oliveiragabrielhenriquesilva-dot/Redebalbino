<style>
.foto-tutora { position: relative; flex: none; border-radius: 50%; overflow: hidden; background: #172C58; border: 6px solid #00D0FF; box-shadow: 0 0 0 26px rgba(0,208,255,0.08), 0 0 0 54px rgba(0,208,255,0.04); }
.foto-tutora img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
.foto-tutora .sem-foto { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.foto-tutora .sem-foto svg { width: 46%; height: 46%; }
.pilula { border: 2px solid #00D0FF; color: #00D0FF; border-radius: 999px; padding: 12px 28px; font-size: 28px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.arte div { text-wrap: balance; }
</style>
<div class="arte" style="width: 1080px; height: 1920px; padding: 230px 80px 240px; display: flex; flex-direction: column;">
<img class="simbolo" src="assets/simbolo-branco.png" alt="" style="right: -260px; top: 260px; width: 900px;">
<div class="topo">
  <img class="logo" src="assets/logo-branco.png" alt="UniCesumar">
  <div class="pilula">POLO {{polo}}</div>
</div>
<div class="miolo" style="align-items: center; justify-content: space-evenly; text-align: center; padding: 20px 0;">
  <div class="foto-tutora" style="width: 480px; height: 480px;">{{{foto_tutora}}}</div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div style="font-size: 52px; font-weight: 500; color: #00D0FF; {{{chamada_topo_oculto}}}">{{chamada_topo}}</div>
    <div style="font-size: {{{nome_tamanho}}}px; font-weight: 800; line-height: 1.02; max-width: 920px;">{{nome_destaque}}</div>
    <div style="font-size: 38px; font-weight: 300; margin-top: 6px; {{{cargo_oculto}}}">{{cargo}}</div>
  </div>
  <div style="font-size: 42px; font-weight: 500; line-height: 1.3; max-width: 860px; {{{mensagem_oculto}}}">{{{mensagem_html}}}</div>
  <div class="cartao-azul" style="align-self: stretch; display: flex; align-items: center; gap: 36px; padding: 30px 36px; text-align: left;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 34px; font-weight: 700; color: #00D0FF; {{{cta_oculto}}}">{{cta}}</div>
      <div style="font-size: 64px; font-weight: 800; line-height: 1; white-space: nowrap;">{{whatsapp}}</div>
    </div>
    <div style="flex: none; width: 210px; height: 210px; border: 4px solid #00D0FF; border-radius: 18px; background: #FFFFFF; padding: 12px;"><img src="{{{qr_url}}}" alt="" style="width: 100%; height: 100%; display: block;"></div>
  </div>
</div>
<div class="rodape"><div class="polo" style="font-size: 32px;">{{rodape_nome}}</div><div class="zap" style="font-size: 28px;">inscricoes.unicesumar.edu.br</div></div>
</div>
